version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nirmaniq_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: nirmaniq
      POSTGRES_PASSWORD: nirmaniq_dev
      POSTGRES_DB: nirmaniq_training
    ports:
      - "5432:5432"
    volumes:
      - nirmaniq_pgdata:/var/lib/postgresql/data
volumes:
  nirmaniq_pgdata: